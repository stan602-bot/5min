<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Minutes to Go</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.board {
    width: min(280px, 100%);
    flex-shrink: 0;
    background: #222; 
    border: 4px solid #222;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.header {
    text-align: center;
    padding: 20px 12px;
    background: #2c2c2c;
    color: white;
    border-bottom: 2px solid #333;
}

/* --- New CSS Glowing Lights Styles --- */
.lights-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 10px 0;
}
.light {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #444; /* Default "Off" state (Dim dark grey) */
    transition: background 0.6s ease, box-shadow 0.6s ease;
    border: 1px solid #111;
}
/* Glowing "On" States */
.light.glow-green {
    background: #2ecc71;
    box-shadow: 0 0 12px #2ecc71, inset 0 0 4px rgba(255,255,255,0.6);
}
.light.glow-yellow {
    background: #f1c40f;
    box-shadow: 0 0 12px #f1c40f, inset 0 0 4px rgba(255,255,255,0.6);
}
.light.glow-red {
    background: #e74c3c;
    box-shadow: 0 0 12px #e74c3c, inset 0 0 4px rgba(255,255,255,0.6);
}

.flap {
    position: relative;
    height: 95px;
    border-bottom: 2px solid #222;
    perspective: 1000px; 
    cursor: pointer;
}
.flap:last-child {
    border-bottom: none;
}
.content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #222;
    user-select: none;
}
.content .number {
    font-size: 44px;
    font-weight: 900;
}
.content .text {
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.8;
}
.cover {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 52px;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    user-select: none;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.8s;
    transform-origin: left center;
    backface-visibility: hidden; 
    z-index: 2;
}
.cover.open {
    transform: rotateY(-140deg);
    box-shadow: 5px 0 15px rgba(0,0,0,0.4);
}

/* Keyboard access and motion accessibility. */
.flap:focus-visible { outline: 3px solid #fff; outline-offset: -4px; }
@media (prefers-reduced-motion: reduce) {
    .cover { transition: none; }
    .light { transition: none; }
}

/* --- Dynamic Color Schemes --- */
.f-4 .content { background: #e8f8f5; color: #1e8449; }
.f-4 .cover { background: linear-gradient(135deg, #2ecc71, #27ae60); }

.f-3 .content { background: #ebf5fb; color: #21618c; }
.f-3 .cover { background: linear-gradient(135deg, #3498db, #2980b9); }

.f-2 .content { background: #fef9e7; color: #b7950b; }
.f-2 .cover { background: linear-gradient(135deg, #f1c40f, #d4ac0d); }

.f-1 .content { background: #fdf2e9; color: #a04000; }
.f-1 .cover { background: linear-gradient(135deg, #e67e22, #d35400); }

.f-fin .content { background: #f5eef8; color: #6c3483; }
.f-fin .cover { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
</style>
</head>
<body>

<div class="board">
    <div class="header">
        <div style="font-size:36px; margin-bottom: 5px;">👇</div>
        
        <div class="lights-container">
            <div class="light" id="light1"></div>
            <div class="light" id="light2"></div>
            <div class="light" id="light3"></div>
        </div>

        <h2 style="margin: 10px 0 5px 0; font-size: 22px;">5 Minute Countdown</h2>
        <p style="margin: 0; color: #aaa; font-size: 14px;">Tap a flap to open or close it!</p>
    </div>

    <div class="flap f-4" role="button" tabindex="0" aria-expanded="false" aria-label="Open 4 minutes to go">
        <div class="content">
            <div class="number">4</div>
            <div class="text">minutes to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-3" role="button" tabindex="0" aria-expanded="false" aria-label="Open 3 minutes to go">
        <div class="content">
            <div class="number">3</div>
            <div class="text">minutes to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-2" role="button" tabindex="0" aria-expanded="false" aria-label="Open 2 minutes to go">
        <div class="content">
            <div class="number">2</div>
            <div class="text">minutes to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-1" role="button" tabindex="0" aria-expanded="false" aria-label="Open 1 minute to go">
        <div class="content">
            <div class="number">1</div>
            <div class="text">minute to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-fin" role="button" tabindex="0" aria-expanded="false" aria-label="Open countdown complete">
        <div class="content">
            <div class="number" style="font-size: 28px;">FINISHED 🎉</div>
            <div class="text">Countdown complete</div>
        </div>
        <div class="cover">✓</div>
    </div>
</div>

<script>
// The three lights advance in 100-second intervals, beginning when the page opens.
// Use real elapsed time so the countdown remains accurate after a backgrounded tab resumes.
const lights = [
    document.getElementById('light1'),
    document.getElementById('light2'),
    document.getElementById('light3')
];
const startedAt = Date.now();
function updateLights() {
    const elapsed = Math.floor((Date.now() - startedAt) / 1000);
    lights[0].classList.toggle('glow-green', elapsed >= 100);
    lights[1].classList.toggle('glow-yellow', elapsed >= 200);
    lights[2].classList.toggle('glow-red', elapsed >= 300);
}
updateLights();
setInterval(updateLights, 1000);
document.addEventListener('visibilitychange', updateLights);
window.addEventListener('focus', updateLights);

// Each flap can be opened/closed manually; the one-minute flap additionally
// displays an accurate seconds countdown, which can be cancelled by closing it.
let minuteInterval = null;
let minuteResetTimeout = null;
let minuteDeadline = 0;
const minuteFlap = document.querySelector('.f-1');
const minuteNumber = minuteFlap.querySelector('.number');
const minuteText = minuteFlap.querySelector('.text');

function stopMinuteCountdown() {
    clearInterval(minuteInterval);
    clearTimeout(minuteResetTimeout);
    minuteInterval = null;
    minuteResetTimeout = null;
}
function resetMinuteDisplay() {
    minuteNumber.textContent = '1';
    minuteText.textContent = 'minute to go';
}
function tickMinuteCountdown() {
    const secondsLeft = Math.max(0, Math.ceil((minuteDeadline - Date.now()) / 1000));
    minuteNumber.textContent = String(secondsLeft);
    minuteText.textContent = secondsLeft === 1 ? 'second to go' : 'seconds to go';
    if (secondsLeft === 0) {
        clearInterval(minuteInterval);
        minuteInterval = null;
        minuteText.textContent = 'Open the window 🎉';
        minuteResetTimeout = setTimeout(() => {
            if (minuteFlap.querySelector('.cover').classList.contains('open')) {
                minuteFlap.querySelector('.cover').classList.remove('open');
                minuteFlap.setAttribute('aria-expanded', 'false');
            }
            resetMinuteDisplay();
            minuteResetTimeout = null;
        }, 4000);
    }
}

document.querySelectorAll('.flap').forEach((flap) => {
    flap.addEventListener('click', () => {
        const cover = flap.querySelector('.cover');
        const isOpen = cover.classList.toggle('open');
        flap.setAttribute('aria-expanded', String(isOpen));
        flap.setAttribute('aria-label', (isOpen ? 'Close ' : 'Open ') + flap.querySelector('.text').textContent);
        if (flap === minuteFlap) {
            stopMinuteCountdown();
            resetMinuteDisplay();
            if (isOpen) {
                minuteDeadline = Date.now() + 60 * 1000;
                minuteInterval = setInterval(tickMinuteCountdown, 250);
            }
        }
    });
    flap.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            flap.click();
        }
    });
});
</script>

</body>
</html>
