<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5 Minutes to Go</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: stretch;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    overflow: hidden;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.board {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    width: 100%;
    background: #222; 
    border: 4px solid #222;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.header {
    flex: 0 0 auto;
    text-align: center;
    padding: clamp(8px, 1.5dvh, 18px) 12px;
    background: #2c2c2c;
    color: white;
    border-bottom: 2px solid #333;
}

/* Keep the original header and all five flaps in one connected panel. */
.header .pointing-hand { font-size: clamp(20px, 4dvh, 36px); line-height: 1; margin-bottom: 5px; }
.header h2 { margin: 7px 0 4px; font-size: clamp(16px, 2.6dvh, 28px); }
.header p { margin: 0; color: #aaa; font-size: clamp(11px, 1.6dvh, 16px); }

/* --- New CSS Glowing Lights Styles --- */
.lights-container {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 2dvh, 20px);
    margin: clamp(5px, 1dvh, 10px) 0;
}
.light {
    width: clamp(13px, 2dvh, 22px);
    height: clamp(13px, 2dvh, 22px);
    border-radius: 50%;
    background: #444; /* Default "Off" state (Dim dark grey) */
    transition: background 0.6s ease, box-shadow 0.6s ease;
    border: 1px solid #111;
}
/* Glowing "On" States */
.light.glow-green {
    background: #2ecc71;
    box-shadow: 0 0 12px #2ecc71, inset 0 0 4px rgba(255,255,255,0.6);
}
.light.glow-yellow {
    background: #f1c40f;
    box-shadow: 0 0 12px #f1c40f, inset 0 0 4px rgba(255,255,255,0.6);
}
.light.glow-red {
    background: #e74c3c;
    box-shadow: 0 0 12px #e74c3c, inset 0 0 4px rgba(255,255,255,0.6);
}

.flap {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    border-bottom: 2px solid #222;
    perspective: 1000px; 
    cursor: pointer;
    touch-action: manipulation;
}
.flap:focus-visible { outline: 3px solid white; outline-offset: -5px; z-index: 4; }
.flap:last-child {
    border-bottom: none;
}
.content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #222;
    user-select: none;
}
.content .number {
    font-size: clamp(23px, 7.6dvh, 100px);
    line-height: 1;
    font-weight: 900;
}
.content .text {
    font-size: clamp(10px, 1.8dvh, 21px);
    line-height: 1.1;
    margin-top: 4px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.8;
}
.cover {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(28px, 9dvh, 105px);
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    user-select: none;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.8s;
    transform-origin: left center;
    backface-visibility: hidden; 
    z-index: 2;
}
.cover.open {
    transform: rotateY(-140deg);
    box-shadow: 5px 0 15px rgba(0,0,0,0.4);
}

/* Keep the FINISHED message readable on short landscape screens. */
.f-fin .number { font-size: clamp(19px, 5dvh, 72px); }
@media (max-height: 480px) {
    .header .pointing-hand { display: none; }
    .header { padding: 5px 10px; }
    .header h2 { margin: 4px 0 2px; }
    .header .lights-container { margin: 3px 0; }
    .content .text { margin-top: 1px; }
}
@media (prefers-reduced-motion: reduce) {
    .cover, .light { transition-duration: .01ms; }
}
/* --- Dynamic Color Schemes --- */
.f-4 .content { background: #e8f8f5; color: #1e8449; }
.f-4 .cover { background: linear-gradient(135deg, #2ecc71, #27ae60); }

.f-3 .content { background: #ebf5fb; color: #21618c; }
.f-3 .cover { background: linear-gradient(135deg, #3498db, #2980b9); }

.f-2 .content { background: #fef9e7; color: #b7950b; }
.f-2 .cover { background: linear-gradient(135deg, #f1c40f, #d4ac0d); }

.f-1 .content { background: #fdf2e9; color: #a04000; }
.f-1 .cover { background: linear-gradient(135deg, #e67e22, #d35400); }

.f-fin .content { background: #f5eef8; color: #6c3483; }
.f-fin .cover { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
</style>
</head>
<body>

<div class="board">
    <div class="header">
        <div class="pointing-hand">👇</div>
        
        <div class="lights-container" aria-label="Timer lights: green at 1 minute 40 seconds, yellow at 3 minutes 20 seconds, red at 5 minutes">
            <div class="light" id="light1"></div>
            <div class="light" id="light2"></div>
            <div class="light" id="light3"></div>
        </div>

        <h2>5 Minute Countdown</h2>
        <p>Tap a flap to open or close it!</p>
    </div>

    <div class="flap f-4" role="button" tabindex="0" aria-pressed="false" aria-label="Open 4 minutes to go">
        <div class="content">
            <div class="number">4</div>
            <div class="text">minutes to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-3" role="button" tabindex="0" aria-pressed="false" aria-label="Open 3 minutes to go">
        <div class="content">
            <div class="number">3</div>
            <div class="text">minutes to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-2" role="button" tabindex="0" aria-pressed="false" aria-label="Open 2 minutes to go">
        <div class="content">
            <div class="number">2</div>
            <div class="text">minutes to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-1" role="button" tabindex="0" aria-pressed="false" aria-label="Open 1 minute to go">
        <div class="content">
            <div class="number">1</div>
            <div class="text">minute to go</div>
        </div>
        <div class="cover">✓</div>
    </div>

    <div class="flap f-fin" role="button" tabindex="0" aria-pressed="false" aria-label="Open finished">
        <div class="content">
            <div class="number">FINISHED 🎉</div>
            <div class="text">Countdown complete</div>
        </div>
        <div class="cover">✓</div>
    </div>
</div>

<script>
// Lights track actual elapsed time, even when a phone suspends background timers.
const lights = [
    document.getElementById('light1'),
    document.getElementById('light2'),
    document.getElementById('light3')
];
const thresholds = [100, 200, 300];
const colours = ['glow-green', 'glow-yellow', 'glow-red'];
const flaps = document.querySelectorAll('.flap');
const minuteFlap = document.querySelector('.f-1');
const minuteNumber = minuteFlap.querySelector('.number');
const minuteText = minuteFlap.querySelector('.text');
let startedAt = Date.now();
let minuteDeadline = null;
let minuteInterval = null;
let minuteResetTimeout = null;

function updateLights() {
    const seconds = Math.floor((Date.now() - startedAt) / 1000);
    lights.forEach((light, i) => {
        light.classList.toggle(colours[i], seconds >= thresholds[i]);
    });
}

function cancelMinuteTimer() {
    clearInterval(minuteInterval);
    clearTimeout(minuteResetTimeout);
    minuteInterval = null;
    minuteResetTimeout = null;
    minuteDeadline = null;
}

function resetMinuteText() {
    minuteNumber.textContent = '1';
    minuteText.textContent = 'minute to go';
}

function updateMinuteTimer() {
    if (minuteDeadline === null) return;
    const seconds = Math.max(0, Math.ceil((minuteDeadline - Date.now()) / 1000));
    minuteNumber.textContent = seconds;
    minuteText.textContent = seconds === 1 ? 'second to go' : 'seconds to go';
    if (seconds === 0) {
        clearInterval(minuteInterval);
        minuteInterval = null;
        minuteDeadline = null;
        minuteText.textContent = 'Open FINISHED 🎉';
        // Close the last-minute flap again after the completion message.
        minuteResetTimeout = setTimeout(() => {
            const cover = minuteFlap.querySelector('.cover');
            cover.classList.remove('open');
            minuteFlap.setAttribute('aria-pressed', 'false');
            minuteFlap.setAttribute('aria-label', 'Open 1 minute to go');
            resetMinuteText();
            minuteResetTimeout = null;
        }, 2500);
    }
}

function toggleFlap(flap) {
    const cover = flap.querySelector('.cover');
    const isOpen = cover.classList.toggle('open');
    flap.setAttribute('aria-pressed', String(isOpen));
    // Closing FINISHED resets every flap, all lights and the countdown timer.
    if (flap.classList.contains('f-fin') && !isOpen) {
        restartCountdown();
        return;
    }
    const number = flap.querySelector('.number').textContent.trim();
    flap.setAttribute('aria-label', `${isOpen ? 'Close' : 'Open'} ${flap.classList.contains('f-fin') ? 'finished' : number + (number === '1' ? ' minute' : ' minutes') + ' to go'}`);

    if (flap === minuteFlap) {
        cancelMinuteTimer();
        if (isOpen) {
            minuteDeadline = Date.now() + 60_000;
            updateMinuteTimer();
            minuteInterval = setInterval(updateMinuteTimer, 250);
        } else {
            resetMinuteText();
        }
    }
}

flaps.forEach(flap => {
    flap.addEventListener('click', () => toggleFlap(flap));
    flap.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleFlap(flap);
        }
    });
});

function restartCountdown() {
    startedAt = Date.now();
    cancelMinuteTimer();
    resetMinuteText();
    flaps.forEach(flap => {
        flap.querySelector('.cover').classList.remove('open');
        flap.setAttribute('aria-pressed', 'false');
        const text = flap.classList.contains('f-fin')
            ? 'finished'
            : flap.querySelector('.number').textContent.trim() + (flap.classList.contains('f-1') ? ' minute' : ' minutes') + ' to go';
        flap.setAttribute('aria-label', 'Open ' + text);
    });
    updateLights();
}

setInterval(() => {
    updateLights();
    updateMinuteTimer();
}, 250);
document.addEventListener('visibilitychange', () => {
    updateLights();
    updateMinuteTimer();
});
window.addEventListener('pageshow', event => {
    if (event.persisted) restartCountdown();
    else updateLights();
});
updateLights();
</script>

</body>
</html>
